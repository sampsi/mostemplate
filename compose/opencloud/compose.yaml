services:
  opencloud-init:
    container_name: opencloud-init
    # Kerran ajettava apukontti: luo kansiot ja antaa ne OpenCloudin käyttäjälle (1000:1000),
    # koska Docker luo puuttuvat bind-kansiot root-omisteisina.
    image: alpine:latest
    command: ["sh", "-c", "mkdir -p /c /d && chown -R 1000:1000 /c /d"]
    volumes:
      - ./config:/c
      - ./data:/d
    restart: "no"

  opencloud:
    container_name: opencloud
    # OpenCloud: oma pilvitallennus (tiedostot, jakaminen, synkronointi työpöytä- ja mobiilisovelluksilla).
    # Vakaa (production) -julkaisu. Ensimmäisellä käynnistyksellä "opencloud init" luo asetukset
    # satunnaisilla salaisuuksilla kansioon ./config; myöhemmin se epäonnistuu tarkoituksella (|| true).
    image: opencloudeu/opencloud:7
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      opencloud-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh"]
    command: ["-c", "opencloud init || true; opencloud server"]
    ports:
      - "9200:9200"
    environment:
      - TZ=Europe/Helsinki
      # osoite jolla OpenCloud avataan selaimessa - pitää täsmätä tarkalleen (https, IP/nimi ja portti)
      - OC_URL=${OC_URL:?aseta OC_URL .env-tiedostoon}
      - PROXY_HTTP_ADDR=0.0.0.0:9200
      # OpenCloud tarjoaa itse HTTPS:n itse allekirjoitetulla varmenteella (selain varoittaa kerran).
      # Käänteisvälityspalvelimen takana: PROXY_TLS=false ja OC_URL=https://pilvi.domain
      - PROXY_TLS=${PROXY_TLS:-true}
      - OC_INSECURE=true
      # admin-käyttäjän salasana (vain ensimmäisellä käynnistyksellä, myöhemmin vaihdetaan web-UI:sta)
      - IDM_ADMIN_PASSWORD=${ADMIN_SALASANA:?aseta ADMIN_SALASANA .env-tiedostoon}
      - IDM_CREATE_DEMO_USERS=false
      - OC_DEFAULT_LANGUAGE=fi
      # WebDAV-asiakkaat jotka eivät tue OpenID Connectia
      - PROXY_ENABLE_BASIC_AUTH=false
    volumes:
      - ./config:/etc/opencloud         # asetukset ja salaisuudet (ÄLÄ hukkaa, varmuuskopioi)
      - ./data:/var/lib/opencloud       # käyttäjien tiedostot ja metatiedot
