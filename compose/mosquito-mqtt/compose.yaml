services:
  mqtt5:
    image: eclipse-mosquitto:2
    container_name: mqtt
    # Mosquitto 2 kuuntelee ilman asetustiedostoa vain localhostia. Jos config/mosquitto.conf
    # puuttuu, luodaan oletus: MQTT 1883 + websocketit 9001, anonyymit sallittu.
    # Lisää käyttäjät/salasanat (password_file) tarvittaessa config/mosquitto.conf-tiedostoon.
    entrypoint:
      - sh
      - -c
      - |
        [ -f /mosquitto/config/mosquitto.conf ] || printf '%s\n' \
          'listener 1883' 'listener 9001' 'protocol websockets' 'allow_anonymous true' \
          'persistence true' 'persistence_location /mosquitto/data/' \
          'log_dest file /mosquitto/log/mosquitto.log' > /mosquitto/config/mosquitto.conf
        exec /docker-entrypoint.sh /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf
    ports:
      - "1883:1883"                     # MQTT
      - "9002:9001"                     # MQTT websocketit (9001 on Portainer Agentin portti)
    volumes:
      - ./config:/mosquitto/config:rw
      - ./data:/mosquitto/data:rw
      - ./log:/mosquitto/log:rw
    restart: unless-stopped
networks:
  default:
    name: mqtt5-network
