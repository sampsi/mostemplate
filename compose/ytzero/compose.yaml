services:
  ytzero:
    container_name: ytzero
    # YT Zero: itse isännöity YouTube-tilausten syöte (julkiset RSS-syötteet, ei Google-tiliä).
    # Image sisältää yt-dlp:n, ffmpegin ja Denon (lataukset / oma soitin).
    image: ghcr.io/pelski/ytzero:latest
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - TZ=Europe/Helsinki
      - IDLE_TIMEOUT_SECONDS=120
      - REFRESH_INTERVAL_MINUTES=5
      - FULL_SYNC_INTERVAL_MINUTES=15
      - VIDEO_MAINTENANCE_MAX_AGE_DAYS=90
      - DB_PATH=/data/db/ytzero.db
      - IMG_CACHE_DIR=/data/imgcache
    volumes:
      - ./data:/data                    # SQLite-tietokanta, kuvavälimuisti, lataukset
