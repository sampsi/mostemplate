services:
  nodered-init:
    container_name: nodered-init
    # Kerran ajettava apukontti: Node-RED ajetaan käyttäjänä 1000, mutta Docker luo puuttuvan
    # ./data-kansion root-omisteisena -> annetaan se käyttäjälle 1000.
    image: alpine:latest
    command: ["sh", "-c", "chown -R 1000:1000 /data"]
    volumes:
      - ./data:/data
    restart: "no"

  nodered:
    container_name: nodered
    # Node-RED: selainpohjainen flow-ohjelmointi (automaatiot, MQTT, HTTP, Home Assistant ym.).
    image: nodered/node-red:latest
    restart: unless-stopped
    depends_on:
      nodered-init:
        condition: service_completed_successfully
    ports:
      - "1880:1880"
    environment:
      - TZ=Europe/Helsinki
    volumes:
      - ./data:/data                    # flowt, asetukset (settings.js), asennetut nodet
